<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Didier Piracoca — Desarrollador de Aplicaciones Multiplataforma">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C98E12"/>
      <stop offset="0.55" stop-color="#F5B82E"/>
      <stop offset="1" stop-color="#FFD978"/>
    </linearGradient>
    <clipPath id="typing">
      <rect class="type" x="96" y="96" width="470" height="44"/>
    </clipPath>
    <style>
      text { font-family: 'Cascadia Code', 'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace; }
      .type { animation: type 1.6s steps(38, end) 0.4s backwards; }
      .cursor { animation: blink 1s step-end infinite; }
      .reveal { animation: fade 0.6s ease-out backwards; }
      .d1 { animation-delay: 2.1s; } .d2 { animation-delay: 2.5s; }
      .d3 { animation-delay: 2.9s; } .d4 { animation-delay: 3.3s; }
      @keyframes type { from { width: 0; } to { width: 470px; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    </style>
  </defs>

  <!-- ventana -->
  <rect x="0" y="0" width="1200" height="460" rx="18" fill="#141417"/>
  <rect x="20" y="20" width="1160" height="420" rx="16" fill="#0B0B0E" stroke="#26262B"/>
  <path d="M36 20 H1164 A16 16 0 0 1 1180 36 V72 H20 V36 A16 16 0 0 1 36 20 Z" fill="#141417"/>
  <line x1="20" y1="72" x2="1180" y2="72" stroke="#26262B"/>
  <circle cx="50" cy="46" r="7" fill="#EF4444"/>
  <circle cx="74" cy="46" r="7" fill="#F5B82E"/>
  <circle cx="98" cy="46" r="7" fill="#34D399"/>
  <text x="126" y="52" font-size="17" fill="#8B8B95">dev@github:~</text>

  <!-- prompt -->
  <rect x="76" y="96" width="1048" height="44" fill="#121216"/>
  <rect x="76" y="96" width="3" height="44" fill="#A855F7"/>
  <g clip-path="url(#typing)">
    <text x="96" y="125" font-size="20" font-weight="700">
      <tspan fill="#F5B82E">Didier</tspan><tspan fill="#E8E6E1"> on </tspan><tspan fill="#38BDF8">~/github</tspan><tspan fill="#34D399"> main</tspan><tspan fill="#E8E6E1"> # cat README.md</tspan>
    </text>
  </g>
  <rect class="cursor" x="566" y="108" width="11" height="22" fill="#F5B82E" opacity="0.9"/>

  <!-- nombre y titulares -->
  <text class="reveal d1" x="76" y="236" font-size="76" font-weight="800" fill="url(#gold)" letter-spacing="2">DIDIER PIRACOCA</text>
  <text class="reveal d2" x="78" y="290" font-size="30" font-weight="700" fill="#F3F1EC">Desarrollador de Aplicaciones Multiplataforma</text>
  <text class="reveal d3" x="78" y="334" font-size="22" font-weight="700" fill="#B57BF7">Angular · Frontend · Java · Spring</text>

  <!-- chips -->
  <g class="reveal d4" font-size="17" font-weight="600" fill="#D9D7D2">
    <rect x="78"  y="370" width="108" height="38" rx="19" fill="#121216" stroke="#33333A"/><text x="132" y="395" text-anchor="middle">Angular</text>
    <rect x="198" y="370" width="140" height="38" rx="19" fill="#121216" stroke="#33333A"/><text x="268" y="395" text-anchor="middle">TypeScript</text>
    <rect x="350" y="370" width="88"  height="38" rx="19" fill="#121216" stroke="#33333A"/><text x="394" y="395" text-anchor="middle">Ionic</text>
    <rect x="450" y="370" width="146" height="38" rx="19" fill="#121216" stroke="#33333A"/><text x="523" y="395" text-anchor="middle">Spring MVC</text>
    <rect x="608" y="370" width="68"  height="38" rx="19" fill="#121216" stroke="#33333A"/><text x="642" y="395" text-anchor="middle">SQL</text>
    <rect x="688" y="370" width="118" height="38" rx="19" fill="#121216" stroke="#33333A"/><text x="747" y="395" text-anchor="middle">Firebase</text>
  </g>
</svg>
